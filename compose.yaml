name: ai-archive-server

services:

  registry-bootstrap:
    build:
      context: .
      dockerfile: docker/queue-manager/Dockerfile

    container_name: ai-archive-registry-bootstrap

    restart: "no"

    volumes:
      - ./registry/data:/app/registry/data
      - ./registry/schema.sql:/app/registry/schema.sql:ro
      - ./registry/migrations:/app/registry/migrations:ro
      - ./AI-Archive:/app/AI-Archive:ro
      - /volume3/AI_Infrastructure/02_Models:/app/02_Models:ro

    command:
      [
        "python",
        "-m",
        "src.model_registry.recovery"
      ]


  queue-manager:
    build:
      context: .
      dockerfile: docker/queue-manager/Dockerfile

    container_name: ai-archive-queue-manager

    restart: unless-stopped

    depends_on:
      registry-bootstrap:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    volumes:
      - ./AI-Archive:/app/AI-Archive
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./registry/data:/app/registry/data
      - /volume3/AI_Infrastructure/02_Models:/app/02_Models:ro


  download-worker:
    build:
      context: .
      dockerfile: docker/download-worker/Dockerfile

    container_name: ai-archive-download-worker

    restart: unless-stopped

    depends_on:
      registry-bootstrap:
        condition: service_completed_successfully
      queue-manager:
        condition: service_healthy

    volumes:
      - ./AI-Archive:/app/AI-Archive
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./registry/data:/app/registry/data
      - /volume3/AI_Infrastructure/02_Models:/app/02_Models:ro