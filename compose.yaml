services:

  queue-manager:

    container_name: ai-archive-queue-manager

    build:
      context: .
      dockerfile: docker/queue-manager/Dockerfile

    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./registry/data:/app/registry/data

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
        ]

      interval: 30s
      timeout: 5s
      retries: 3