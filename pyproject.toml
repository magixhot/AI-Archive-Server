[project]
name = "ai-archive-server"
version = "0.1.0"
description = "Autonomous AI Model Archive Infrastructure"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "huggingface_hub",
]


[project.scripts]
archive = "archive.__main__:main"


[build-system]
requires = [
    "setuptools>=68"
]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = [
    "src"
]


[tool.ruff]
line-length = 100


[tool.pytest.ini_options]
testpaths = [
    "tests"
]